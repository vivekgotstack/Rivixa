  <text x="287" y="365" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="2">RIVIXA</text>
  <text x="289" y="401" fill="#eafaff" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3">LIFESCIENCES</text>
  <text x="289" y="582" fill="#123f6f" font-family="Arial, sans-serif" font-size="49" font-weight="800" letter-spacing="1">FERTIVIX-M</text>
  <path d="M290 605H570" stroke="#f18c56" stroke-width="5"/>
  <text x="290" y="654" fill="#08739d" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">COMPOSITION</text>
  <text x="290" y="691" fill="#263746" font-family="Arial, sans-serif" font-size="16">Coenzyme Q10, N Acetyl Cysteine, Astaxanthin,</text>
  <text x="290" y="717" fill="#263746" font-family="Arial, sans-serif" font-size="16">Vitamin D3, Selenomethionine, L Carnitine,</text>
  <text x="290" y="743" fill="#263746" font-family="Arial, sans-serif" font-size="16">L-Tartrate, Lycopene 10%, Zinc Sulphate</text>
  <text x="290" y="769" fill="#263746" font-family="Arial, sans-serif" font-size="16">Monohydrate, Proanthocyanidins &amp;</text>
  <text x="290" y="795" fill="#263746" font-family="Arial, sans-serif" font-size="16">Protodioscin (Tribulus Terrestris Extract) Tablets</text>
  <text x="290" y="889" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">RIVIXA LIFESCIENCES PVT. LTD.</text>
