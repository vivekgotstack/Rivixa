<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Fertivix-M by Rivixa packaging concept</title>
  <desc id="desc">Illustrative carton with the supplied Fertivix-M composition and Rivixa branding.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eaf4f9"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#cce4ed"/><stop offset="1" stop-color="#e8f3f7"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#07549a"/><stop offset=".55" stop-color="#0787b7"/><stop offset="1" stop-color="#12b7c5"/></linearGradient>
    <pattern id="lines" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)"><path d="M0 0H42" fill="none" stroke="#137eaa" stroke-opacity=".07" stroke-width="2"/></pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="frontClip"><path d="M245 285H800V960L245 915Z"/></clipPath>
  </defs>
  <ellipse cx="618" cy="1011" rx="376" ry="45" fill="#163a57" opacity=".2" filter="url(#shadow)"/>
  <path d="M245 285 399 174 950 215 800 285Z" fill="url(#top)" stroke="#d2e1e8" stroke-width="3"/>
  <path d="M800 285 950 215V902L800 960Z" fill="url(#side)" stroke="#d0e0e7" stroke-width="3"/>
  <path d="M800 285 950 215V902L800 960Z" fill="url(#lines)" opacity=".8"/>
  <path d="M245 285H800V960L245 915Z" fill="#fff" stroke="#cfdee6" stroke-width="3"/>
  <g clip-path="url(#frontClip)">
    <path d="M245 285H800V472C654 527 455 526 245 455Z" fill="url(#band)"/>
    <path d="M245 455C455 526 654 527 800 472" fill="none" stroke="#f5a26c" stroke-width="8"/>
    <circle cx="704" cy="371" r="118" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="2"/>
    <circle cx="704" cy="371" r="88" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="704" cy="371" r="58" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>
    <path d="M245 535H800V954L245 909Z" fill="url(#lines)"/>
    <path d="M245 856C433 886 634 898 800 873V960L245 915Z" fill="url(#band)"/>
    <path d="M245 847C433 877 634 889 800 864" fill="none" stroke="#f5a26c" stroke-width="7"/>
