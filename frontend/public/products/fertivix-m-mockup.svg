  <text x="899" y="690" transform="rotate(-90 899 690)" fill="#07549a" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="2">FERTIVIX-M</text>
  <path d="M421 193 787 220" stroke="#0b7fae" stroke-opacity=".55" stroke-width="7"/>
  <circle cx="447" cy="192" r="7" fill="#f18c56"/>
