<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Fertivix-F by Rivixa packaging concept</title>
  <desc id="desc">Illustrative carton with the supplied Fertivix-F composition and Rivixa branding.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f7edf5"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ead5e8"/><stop offset="1" stop-color="#f7edf5"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#763f91"/><stop offset=".55" stop-color="#b12a82"/><stop offset="1" stop-color="#dc568c"/></linearGradient>
    <pattern id="lines" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)"><path d="M0 0H42" fill="none" stroke="#9f4a9a" stroke-opacity=".08" stroke-width="2"/></pattern>
