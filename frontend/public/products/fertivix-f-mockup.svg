  <text x="290" y="698" fill="#382f3c" font-family="Arial, sans-serif" font-size="17">Coenzyme Q10, DHEA, Vitamin D3,</text>
  <text x="290" y="728" fill="#382f3c" font-family="Arial, sans-serif" font-size="17">L Leucine Tablets</text>
  <text x="290" y="889" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">RIVIXA LIFESCIENCES PVT. LTD.</text>
