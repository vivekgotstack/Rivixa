  <text x="289" y="401" fill="#fff1fa" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3">LIFESCIENCES</text>
  <text x="289" y="582" fill="#6f397d" font-family="Arial, sans-serif" font-size="49" font-weight="800" letter-spacing="1">FERTIVIX-F</text>
