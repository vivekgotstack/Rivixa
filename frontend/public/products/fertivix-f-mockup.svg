    <path d="M245 455C455 526 654 527 800 472" fill="none" stroke="#f2b287" stroke-width="8"/>
    <circle cx="704" cy="371" r="118" fill="none" stroke="#fff" stroke-opacity=".15" stroke-width="2"/>
    <circle cx="704" cy="371" r="88" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="2"/>
    <circle cx="704" cy="371" r="58" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>
