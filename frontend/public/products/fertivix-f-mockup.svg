  <path d="M800 285 950 215V902L800 960Z" fill="url(#side)" stroke="#e3d4e0" stroke-width="3"/>
  <path d="M800 285 950 215V902L800 960Z" fill="url(#lines)" opacity=".8"/>
  <path d="M245 285H800V960L245 915Z" fill="#fff" stroke="#e2d5e0" stroke-width="3"/>
  <g clip-path="url(#frontClip)">
